    async create(data) { await wait(); const item = { ...data, id: nextId('tpl') }; _db.templates.push(item); return { ...item }; },
    async update(id, patch) { await wait(); _db.templates = _db.templates.map(t => t.id === id ? { ...t, ...patch, id } : t); return { ..._db.templates.find(t => t.id === id) }; },
    async remove(id) { await wait(); _db.templates = _db.templates.filter(t => t.id !== id); return true; },
    async incrementInstalls(id) { _db.templates = _db.templates.map(t => t.id === id ? { ...t, installsCount: (t.installsCount || 0) + 1 } : t); return { ..._db.templates.find(t => t.id === id) }; },
  },
  categories: {
    async list() { await wait(); return [..._db.categories]; },
    async create(value) { await wait(); if (!_db.categories.includes(value)) _db.categories.push(value); return [..._db.categories]; },
    async remove(value) { await wait(); _db.categories = _db.categories.filter(c => c !== value); return [..._db.categories]; },
  },
  businessTypes: {
    async list() { await wait(); return _db.businessTypes.map(t => ({ ...t })); },
    async create(data) { await wait(); const slug = data.label.toLowerCase().replace(/[^a-zа-я0-9]+/gi, '-').slice(0, 24) || nextId('type'); const item = { ...data, id: slug }; _db.businessTypes.push(item); return { ...item }; },
    async update(id, patch) { await wait(); _db.businessTypes = _db.businessTypes.map(t => t.id === id ? { ...t, ...patch, id } : t); return { ..._db.businessTypes.find(t => t.id === id) }; },
    async remove(id) { await wait(); _db.businessTypes = _db.businessTypes.filter(t => t.id !== id); return true; },
  },
};

/* ============================================================
   SERVICE LAYER — pure, backend-agnostic business logic.
   These functions never touch the DOM or React state; they take
   plain data in and return plain data out, so they are trivially
   unit-testable and reusable if the UI layer is ever swapped
   (e.g. for a native mobile app reusing the same core).
============================================================ */
const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

function calcChance(visits, lastVisitDays) {
  const raw = 48 + visits * 3.2 - lastVisitDays * 1.35;
  return clamp(Math.round(raw), 5, 99);
}
function tagFromChance(chance) {
  if (chance >= 85) return 'VIP';
  if (chance < 55) return 'At Risk';
  return 'Regular';
}
function calcForecast(template, { budget, audienceSize, timeSlot }) {
  const audienceMult = { small: 0.75, medium: 1, large: 1.3 }[audienceSize] || 1;
  const budgetMult = clamp(0.7 + (budget / 20000) * 0.6, 0.7, 1.5);
  const timeMult = timeSlot === 'offpeak' ? 1.25 : 1;
  const visitors = Math.round(template.baseVisitorImpact * audienceMult * budgetMult * timeMult);
  const revenue = Math.round(template.baseRevenueImpact * audienceMult * budgetMult * timeMult);
  return { visitors: clamp(visitors, 3, 65), revenue: clamp(revenue, 3, 70) };
}
function buildGrowthCurve(dailyBase, forecastVisitorsPct) {
  const upliftFactor = 1 + forecastVisitorsPct / 100;
  const days = [];
  for (let d = 1; d <= 14; d++) {
    const ramp = Math.min(1, d / 5);
    days.push(Math.round(dailyBase * (1 + (upliftFactor - 1) * ramp)));
  }
  return days;
}
function calcGrowthScoreParts(customers, activeScenarioCount, avgChance) {
  const repeatRate = customers.length ? Math.round((customers.filter(c => c.visits > 5).length / customers.length) * 100) : 0;
  const scenarioScore = Math.min(100, activeScenarioCount * 16);
  const score = clamp(Math.round(repeatRate * 0.35 + avgChance * 0.35 + scenarioScore * 0.3), 0, 100);
  return { score, repeatRate, avgChance, scenarioScore };
}

/* Per-scenario incremental sales contribution — the ONLY function that
   converts a forecast (%) into money. Used both for the single-scenario
   preview cards AND summed for the business-wide totals, so a table of
   individual scenarios always adds up exactly to the aggregate shown
   elsewhere. There is no second, independently-averaged calculation. */
function calcScenarioSales(forecast, business) {
  const avgCheck = AVG_CHECK_BY_TYPE[business.type] || 3000;
  const dailyBase = BUSINESS_SIZES.find(s => s.id === business.size)?.dailyBase || 8;
  const extraOrdersDay = Math.max(1, Math.round(dailyBase * (forecast.visitors / 100)));
  const extraOrdersMonth = extraOrdersDay * 30;
  const scenarioAvgCheck = Math.round(avgCheck * (1 + forecast.revenue / 200));
  const extraRevenueMonth = Math.round(extraOrdersMonth * scenarioAvgCheck);
  return { extraOrdersDay, extraOrdersMonth, extraRevenueMonth, avgCheck: scenarioAvgCheck };
}

/* Business-wide totals = base (no scenarios) + SUM of each Active
   scenario's independent contribution. Fixes the earlier bug where an
   averaged percentage was applied once — every number on every screen
   now derives from this single summation. */
function calcBusinessSales(business, installedScenarios) {
  const avgCheck = AVG_CHECK_BY_TYPE[business.type] || 3000;
  const dailyBase = BUSINESS_SIZES.find(s => s.id === business.size)?.dailyBase || 8;
  const baseOrdersMonth = dailyBase * 30;
  const baseRevenue = Math.round(baseOrdersMonth * avgCheck);

  const active = installedScenarios.filter(s => s.status === 'Active');
  let extraOrdersMonth = 0, extraRevenueMonth = 0;
  active.forEach(s => {
    const contrib = calcScenarioSales(s.forecast, business);
    extraOrdersMonth += contrib.extraOrdersMonth;
    extraRevenueMonth += contrib.extraRevenueMonth;
  });

  const ordersMonth = baseOrdersMonth + extraOrdersMonth;
  const currentRevenue = baseRevenue + extraRevenueMonth;
  return {
    avgCheck: ordersMonth ? Math.round(currentRevenue / ordersMonth) : avgCheck,
    baseAvgCheck: avgCheck,
    baseRevenue, currentRevenue,
    revenueGrowthAbs: extraRevenueMonth,
    revenueGrowthPct: baseRevenue ? Math.round((extraRevenueMonth / baseRevenue) * 100) : 0,
    ordersMonth, baseOrdersMonth,
  };
}

function formatTenge(n) { return '₸ ' + Math.round(n).toLocaleString('ru-RU'); }
function timeAgo(ts) {
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.floor(diff / 60000);
  if (min < 1) return 'только что';
  if (min < 60) return `${min} мин назад`;
  const hr = Math.floor(min / 60);
  if (hr < 24) return `${hr} ч назад`;
  return `${Math.floor(hr / 24)} дн назад`;
}

function generateCustomers(businessType, templates, seeds) {
  const relevantCats = [...new Set(templates.filter(t => t.businessTypes.includes(businessType)).map(t => t.title))];
  const fallback = DEMO_PROFILE_SEEDS[businessType] || {};
  const visitsSeed = (seeds && seeds.visitsSeed) || fallback.visitsSeed || [18, 9, 24, 4, 12, 7];
  const lastVisitSeed = (seeds && seeds.lastVisitSeed) || fallback.lastVisitSeed || [2, 6, 1, 28, 4, 12];
  return NAME_POOL.map((p, i) => {
    const visits = visitsSeed[i];
    const lastVisitDays = lastVisitSeed[i];
    const chance = calcChance(visits, lastVisitDays);
    return { id: nextId('cust'), name: p.name, phone: p.phone, visits, lastVisitDays, favorite: relevantCats[i % relevantCats.length] || '—', chance, tag: tagFromChance(chance) };
  });
}

function buildHourlyPattern(installedScenarios) {
  const base = [14, 20, 32, 45, 38, 26, 30, 48, 55, 40, 28, 16];
  const trafficBoost = installedScenarios.filter(s => s.status === 'Active' && s.category === 'marketing').length;
  return base.map((v, i) => {
    const isOffpeakHour = i < 3 || i > 9;
    const bump = trafficBoost && isOffpeakHour ? trafficBoost * 6 : trafficBoost * 2;
    return Math.round(v + bump);
  });
}

function defaultProfileForType(type, templates, businessTypes) {
  const label = businessTypes.find(b => b.id === type)?.label || type;
  const name = DEMO_BUSINESS_NAMES[type] || `Демо: ${label}`;
  const seed = DEMO_PROFILE_SEEDS[type] || { goals: ['traffic', 'retention'], size: 'single', address: '' };
  return {
    business: { name, type, size: seed.size, address: seed.address, goals: seed.goals },
    customers: generateCustomers(type, templates, seed),
    favorites: [],
    installedScenarios: [],
    history: [{ id: nextId('hist'), text: `Открыт демо-профиль «${name}»`, icon: '🏪', timestamp: Date.now() }],
  };
}

/* ------------------------------------------------------------
   GROWTH INTELLIGENCE — local, explainable recommendation
   engine. It never calls any external AI API (none is used or
   required); instead it scores every catalog scenario against
   the business profile, stated goals, and live customer-base
   signals, and exposes the exact reasons behind each score so
   the result is fully explainable rather than a black box.
------------------------------------------------------------- */
const GrowthIntelligence = {
  recommend(templates, business, customers, installedScenarios) {
    const installedIds = installedScenarios.filter(s => s.status !== 'Completed').map(s => s.templateId);
    const avgChance = customers.length ? Math.round(customers.reduce((s, c) => s + c.chance, 0) / customers.length) : 0;
    const goalCategoryMap = { traffic: 'marketing', retention: 'retention', upsell: 'sales' };

    return templates
      .filter(t => t.businessTypes.includes(business.type) && !installedIds.includes(t.id))
      .map(t => {
        const signals = [];
        let score = 0;
        business.goals.forEach(g => {
          if (goalCategoryMap[g] === t.category) {
            score += 30;
            signals.push(`совпадает с целью «${GOALS_OPTIONS.find(o => o.id === g)?.label}»`);
          }
          if (g === 'fill' && t.fillsEmptyHours) {
            score += 25;
            signals.push('заполняет пустые часы работы');
          }
        });
        if (avgChance < 65 && t.category === 'retention') {
          score += 20;
          signals.push(`средний шанс возврата клиентов ${avgChance}% — ниже нормы`);
        }
        if (t.automated) {
          score += 5;
          signals.push('работает автоматически, не требует внимания');
        }
        return { ...t, score, signals };
      })
      .filter(t => t.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 4);
  },

  insights(business, customers, installedScenarios) {
    const out = [];
    const atRisk = customers.filter(c => c.tag === 'At Risk').length;
    if (atRisk > 0) out.push({ icon: '⚠️', text: `${atRisk} клиент(ов) в базе — в зоне риска оттока. Рекомендуем Win-Back Push.` });
    const active = installedScenarios.filter(s => s.status === 'Active');
    if (active.length === 0) out.push({ icon: '🚀', text: 'Нет ни одного активного сценария — начните с рекомендации ниже, чтобы запустить первый рост.' });
    if (active.length > 0) {
      const best = active.slice().sort((a, b) => b.forecast.revenue - a.forecast.revenue)[0];
      out.push({ icon: '🏆', text: `Лучший результат показывает «${best.title}»: прирост среднего чека +${best.forecast.revenue}%.` });
    }
    const paused = installedScenarios.filter(s => s.status === 'Paused').length;
    if (paused > 0) out.push({ icon: '⏸', text: `${paused} сценарий(ев) на паузе — их эффект временно не учитывается в прогнозе выручки.` });
    return out.slice(0, 3);
  },
};

  const canNext2 = form.goals.length > 0;

  return (
    <div className="min-h-screen flex items-center justify-center p-6">
      <div className="w-full max-w-xl">
        <div className="flex items-center gap-3 mb-8 justify-center">
          <div className="w-10 h-10 rounded-xl bg-brand-indigo flex items-center justify-center text-white font-display font-extrabold">G</div>
          <div>
            <p className="font-display font-extrabold text-lg leading-none">Growth Store</p>
            <p className="text-xs text-brand-sub dark:text-brand-subDark">Рост для малого офлайн-бизнеса</p>

          <div className="flex items-center gap-2 mb-6" role="progressbar" aria-valuenow={step} aria-valuemin="1" aria-valuemax="3">
            {[1, 2, 3].map(s => <div key={s} className={`h-1.5 flex-1 rounded-full transition-base ${s <= step ? 'bg-brand-indigo' : 'bg-brand-surface2 dark:bg-brand-surface2Dark'}`} />)}

          {step === 1 && (
            <div className="space-y-5 animate-fadeIn">
              <div>
                <h2 className="font-display font-extrabold text-xl">Расскажите о вашем бизнесе</h2>
                <p className="text-sm text-brand-sub dark:text-brand-subDark mt-1">Тип, размер и цели помогут подобрать подходящие сценарии роста.</p>

              <Field label="Название бизнеса">
                <input className={inputCls} placeholder="Например, Bean & Bloom" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} />

              </Field>
              <Field label="Тип бизнеса">
                <div className="grid grid-cols-3 gap-3">
                  {businessTypes.map(bt => (
                    <button key={bt.id} onClick={() => setForm({ ...form, type: bt.id })}
                      className={`p-4 rounded-xl border text-center transition-base focus-ring ${form.type === bt.id ? 'border-brand-indigo bg-brand-indigoSoft dark:bg-brand-indigoSoftDark ring-2 ring-brand-indigo/30' : 'border-brand-border dark:border-brand-borderDark hover:border-brand-indigo/50'}`}>
                      <div className="text-2xl mb-1">{bt.icon}</div>
                      <div className="text-xs font-semibold">{bt.label}</div>
                    </button>
                  ))}
                </div>
              </Field>
              <Field label="Размер бизнеса">
                <div className="grid grid-cols-3 gap-3">
                  {BUSINESS_SIZES.map(sz => (
                    <button key={sz.id} onClick={() => setForm({ ...form, size: sz.id })}
                      className={`p-3 rounded-xl border text-center transition-base text-xs font-semibold focus-ring ${form.size === sz.id ? 'border-brand-indigo bg-brand-indigoSoft dark:bg-brand-indigoSoftDark ring-2 ring-brand-indigo/30' : 'border-brand-border dark:border-brand-borderDark hover:border-brand-indigo/50'}`}>
                      {sz.label}
                    </button>
                  ))}
                </div>
              </Field>
              <Button className="w-full" disabled={!canNext1} onClick={() => setStep(2)}>Продолжить <Icon.Arrow className="w-4 h-4" /></Button>
            </div>
          )}

          {step === 2 && (
            <div className="space-y-5 animate-fadeIn">
              <div>
                <h2 className="font-display font-extrabold text-xl">Какие у вас цели?</h2>
                <p className="text-sm text-brand-sub dark:text-brand-subDark mt-1">Выберите один или несколько пунктов — по ним Growth Intelligence подберёт сценарии.</p>
              </div>
              <div className="space-y-2.5">
                {GOALS_OPTIONS.map(g => {
                  const checked = form.goals.includes(g.id);
                  return (
                    <div key={g.id} onClick={() => toggleGoal(g.id)} role="checkbox" aria-checked={checked} tabIndex={0}
                      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') toggleGoal(g.id); }}
                      className={`p-3.5 rounded-xl border cursor-pointer flex items-center gap-3 transition-base focus-ring ${checked ? 'border-brand-indigo bg-brand-indigoSoft dark:bg-brand-indigoSoftDark' : 'border-brand-border dark:border-brand-borderDark hover:border-brand-indigo/40'}`}>

                        <p className="text-xs text-brand-sub dark:text-brand-subDark">{g.help}</p>
                      </div>

                  );
                })}
              </div>
              <div className="flex gap-3">
                <Button variant="secondary" onClick={() => setStep(1)}><Icon.Back className="w-4 h-4" /> Назад</Button>
                <Button className="flex-1" disabled={!canNext2} onClick={() => setStep(3)}>Показать рекомендации <Icon.Arrow className="w-4 h-4" /></Button>
              </div>
            </div>
          )}

          {step === 3 && (
            <div className="space-y-5 animate-fadeIn">
              <div>
                <h2 className="font-display font-extrabold text-xl">Всё готово, {form.name}</h2>
                <p className="text-sm text-brand-sub dark:text-brand-subDark mt-1">На основе типа, размера бизнеса и целей мы подобрали первые сценарии роста. Их можно поменять в любой момент в разделе «AI-советник».</p>
              </div>
              <div className="p-4 rounded-xl bg-brand-surface2 dark:bg-brand-surface2Dark space-y-1.5 text-sm">
                <p><span className="text-brand-sub dark:text-brand-subDark">Бизнес: </span><strong>{form.name}</strong> ({businessTypes.find(b => b.id === form.type)?.label})</p>
                <p><span className="text-brand-sub dark:text-brand-subDark">Размер: </span><strong>{BUSINESS_SIZES.find(s => s.id === form.size)?.label}</strong></p>
                <p><span className="text-brand-sub dark:text-brand-subDark">Цели: </span><strong>{form.goals.map(g => GOALS_OPTIONS.find(o => o.id === g)?.label).join(', ')}</strong></p>
              </div>
              <Button className="w-full" onClick={() => onComplete(form)}>Открыть Growth Store <Icon.Arrow className="w-4 h-4" /></Button>
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

function StoreScreen({ business, templates, favorites, toggleFavorite, openBuilder, categories, businessTypes, installedScenarios }) {
  const [query, setQuery] = useState('');
  const [category, setCategory] = useState('all');
  const [onlyRelevant, setOnlyRelevant] = useState(true);
  const [onlyFav, setOnlyFav] = useState(false);

  const installCounts = useMemo(() => {
    const map = {};
    installedScenarios.filter(s => s.status === 'Active').forEach(s => { map[s.templateId] = (map[s.templateId] || 0) + 1; });
    return map;
  }, [installedScenarios]);

  const filtered = templates.filter(t => {
    if (onlyRelevant && !t.businessTypes.includes(business.type)) return false;
    if (onlyFav && !favorites.includes(t.id)) return false;
    if (query && !(`${t.title} ${t.description}`.toLowerCase().includes(query.toLowerCase()))) return false;
    if (category === 'automation') return t.automated;
    if (category !== 'all' && category !== 'analytics' && t.category !== category) return false;
    return true;
  });

  const chips = [
    { id: 'all', label: 'Все' },
    ...categories.map(c => ({ id: c, label: getCategoryLabel(c) })),
    { id: 'analytics', label: '📊 Аналитика' },
    { id: 'automation', label: '⚙️ Автоматизация' },
  ];

  return (
    <div className="max-w-6xl mx-auto space-y-6 animate-fadeIn">
      <div>
        <h1 className="text-2xl font-display font-extrabold">Growth Store</h1>
        <p className="text-sm text-brand-sub dark:text-brand-subDark mt-1">Готовые сценарии роста — каждый сразу включает маркетинг, работу с клиентской базой и аналитику. Никакой отдельной настройки инструментов.</p>
      </div>

      <div className="flex flex-col md:flex-row gap-3">
        <div className="relative flex-1">
          <Icon.Search className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-brand-sub dark:text-brand-subDark" aria-hidden="true" />
          <input className={inputCls + ' pl-10'} placeholder="Поиск сценария..." value={query} onChange={e => setQuery(e.target.value)} aria-label="Поиск сценария" />
        </div>
        <button onClick={() => setOnlyFav(!onlyFav)} aria-pressed={onlyFav}
          className={`px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 border transition-base focus-ring ${onlyFav ? 'bg-brand-indigo text-white border-brand-indigo' : 'border-brand-border dark:border-brand-borderDark hover:border-brand-indigo/50'}`}>
          <Icon.Heart className="w-3.5 h-3.5" filled={onlyFav} /> Избранное ({favorites.length})
        </button>
        <button onClick={() => setOnlyRelevant(!onlyRelevant)} aria-pressed={onlyRelevant}
          className={`px-4 py-2.5 rounded-xl text-xs font-bold border transition-base focus-ring ${onlyRelevant ? 'bg-brand-surface2 dark:bg-brand-surface2Dark border-brand-border dark:border-brand-borderDark' : 'border-brand-border dark:border-brand-borderDark opacity-60'}`}>
          Только для «{businessTypes.find(b => b.id === business.type)?.label}»
        </button>
      </div>

      <div className="flex flex-wrap gap-2">
        {chips.map(c => (
          <button key={c.id} onClick={() => setCategory(c.id)} aria-pressed={category === c.id}
            className={`px-3.5 py-1.5 rounded-full text-xs font-bold transition-base focus-ring ${category === c.id ? 'bg-brand-text dark:bg-brand-textDark text-brand-bg dark:text-brand-bgDark' : 'bg-brand-surface2 dark:bg-brand-surface2Dark text-brand-sub dark:text-brand-subDark'}`}>
            {c.label}
          </button>
        ))}
      </div>
      {category === 'analytics' && (
        <div className="p-3 rounded-xl bg-brand-indigoSoft dark:bg-brand-indigoSoftDark text-xs text-brand-indigo dark:text-brand-indigoDark animate-fadeIn">
          Модуль аналитики включён в каждый сценарий по умолчанию — не нужно устанавливать его отдельно. Ниже показаны все сценарии со встроенной аналитикой результатов.
        </div>
      )}

      {filtered.length === 0 ? (
        <EmptyState text="Ничего не найдено" sub="Измените фильтры или поисковый запрос" />
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
          {filtered.map(t => {
            const preview = calcForecast(t, { budget: 10000, audienceSize: 'medium', timeSlot: t.fillsEmptyHours ? 'offpeak' : 'peak' });
            const previewSales = calcScenarioSales(preview, business);
            const isFav = favorites.includes(t.id);
            const installs = installCounts[t.id] || 0;
            return (
              <Card key={t.id} className="p-5 flex flex-col justify-between" lift>
                <div>
                  <div className="flex items-start justify-between mb-3">
                    <div className="w-12 h-12 rounded-xl bg-brand-surface2 dark:bg-brand-surface2Dark flex items-center justify-center text-2xl" aria-hidden="true">{t.icon}</div>
                    <IconButton icon={Icon.Heart} onClick={() => toggleFavorite(t.id)} label={isFav ? 'Убрать из избранного' : 'Добавить в избранное'} className={isFav ? 'text-brand-red' : 'text-brand-sub dark:text-brand-subDark'} />
                  </div>
                  <div className="flex flex-wrap gap-1.5">
                    <Badge className={getCategoryColor(t.category)}>{getCategoryLabel(t.category)}</Badge>
                    {t.automated && <Badge className="bg-brand-surface2 dark:bg-brand-surface2Dark text-brand-sub dark:text-brand-subDark">⚙️ Автоматизация</Badge>}
                    {installs > 0 && <Badge className="bg-brand-greenSoft dark:bg-brand-greenSoftDark text-brand-green">✓ Активно {installs}×</Badge>}
                  </div>
                  <h3 className="font-display font-bold text-base mt-2">{t.title}</h3>
                  <p className="text-xs text-brand-sub dark:text-brand-subDark leading-relaxed mt-1.5">{t.description}</p>
                </div>
                <div className="mt-4">
                  <div className="flex items-center justify-between text-xs font-bold bg-brand-surface2 dark:bg-brand-surface2Dark rounded-lg p-2.5 mb-2">
                    <span className="text-brand-sub dark:text-brand-subDark">Прогноз</span>
                    <span className="text-brand-indigo dark:text-brand-indigoDark">+{preview.visitors}% клиентов · +{preview.revenue}% чек</span>
                  </div>
                  <div className="flex items-center justify-between text-xs font-bold bg-brand-indigoSoft dark:bg-brand-indigoSoftDark rounded-lg p-2.5 mb-3">
                    <span className="text-brand-indigo dark:text-brand-indigoDark">Оценка выручки</span>
                    <span className="text-brand-indigo dark:text-brand-indigoDark">+{formatTenge(previewSales.extraRevenueMonth)}/мес</span>
                  </div>
                  <Button className="w-full" onClick={() => openBuilder(t.id)}>{installs > 0 ? 'Установить ещё' : 'Установить'}</Button>
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ============================================================

   unconditionally before the single early return.
============================================================ */
function BuilderScreen({ template, business, onConfirm, navigate }) {
  const [audienceSize, setAudienceSize] = useState('medium');
  const [budget, setBudget] = useState(10000);
  const [timeSlot, setTimeSlot] = useState('peak');
  const [offer, setOffer] = useState('');
  const [time, setTime] = useState('');
  const [audience, setAudience] = useState('');
  const [showConfirm, setShowConfirm] = useState(false);

  useEffect(() => {
    if (!template) return;
    setTimeSlot(template.fillsEmptyHours ? 'offpeak' : 'peak');
    setOffer(template.defaultOffer);
    setTime(template.defaultTime);
    setAudience(template.defaultAudience);
    setShowConfirm(false);
  }, [template?.id]);

  const forecast = useMemo(() => template ? calcForecast(template, { budget, audienceSize, timeSlot }) : { visitors: 0, revenue: 0 }, [template, budget, audienceSize, timeSlot]);
  const dailyBase = BUSINESS_SIZES.find(s => s.id === business.size)?.dailyBase || 8;
  const curve = useMemo(() => buildGrowthCurve(dailyBase, forecast.visitors), [dailyBase, forecast.visitors]);
  const sales = useMemo(() => template ? calcScenarioSales(forecast, business) : null, [template, forecast, business]);

      </div>
    );

  const launch = () => onConfirm(template, { audience, audienceSize, timeSlot, time, offer, budget, forecast });

  return (
    <div className="max-w-6xl mx-auto space-y-6 animate-fadeIn">
      <div className="flex items-center gap-3">

        </div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <Card className="lg:col-span-7 p-6 space-y-5">
          <Field label="Целевая аудитория"><input className={inputCls} value={audience} onChange={e => setAudience(e.target.value)} /></Field>
          <div className="grid grid-cols-2 gap-4">
            <Field label="Размер аудитории">
              <select className={inputCls} value={audienceSize} onChange={e => setAudienceSize(e.target.value)}>
                <option value="small">Небольшая (район)</option>
                <option value="medium">Средняя (несколько районов)</option>
                <option value="large">Большая (весь город)</option>
              </select>
            </Field>
            <Field label="Время активности">
              <select className={inputCls} value={timeSlot} onChange={e => setTimeSlot(e.target.value)}>
                <option value="peak">Часы пик</option>
                <option value="offpeak">Свободные часы</option>
              </select>
            </Field>
          </div>
          <Field label="Часы / период проведения"><input className={inputCls} value={time} onChange={e => setTime(e.target.value)} /></Field>
          <Field label="Текст предложения для клиента"><input className={inputCls} value={offer} onChange={e => setOffer(e.target.value)} /></Field>
          <Field label={`Бюджет на продвижение: ${formatTenge(budget)}`} hint="Больше бюджет → выше охват аудитории и точнее таргетинг">
            <input type="range" min="0" max="30000" step="1000" value={budget} onChange={e => setBudget(Number(e.target.value))} className="w-full accent-[#4B898E]" aria-label="Бюджет" />
          </Field>

          <div className="p-4 rounded-xl bg-brand-indigoSoft dark:bg-brand-indigoSoftDark flex items-center justify-between">
            <div>
              <p className="text-xs font-bold text-brand-indigo dark:text-brand-indigoDark uppercase">Прогноз эффекта</p>

            <span className="text-2xl font-display font-extrabold text-brand-indigo dark:text-brand-indigoDark num-transition">+{forecast.revenue}%</span>

          {sales && (

              <div><p className="text-[10px] font-bold text-brand-green uppercase">Доп. заказов/мес</p><p className="text-base font-display font-extrabold num-transition">{sales.extraOrdersMonth}</p></div>
              <div><p className="text-[10px] font-bold text-brand-green uppercase">Средний чек</p><p className="text-base font-display font-extrabold num-transition">{formatTenge(sales.avgCheck)}</p></div>
              <div><p className="text-[10px] font-bold text-brand-green uppercase">Доп. выручка/мес</p><p className="text-base font-display font-extrabold num-transition">{formatTenge(sales.extraRevenueMonth)}</p></div>

              <p className="text-[10px] text-brand-sub dark:text-brand-subDark">Уведомление · {business.name}</p>
              <div className="bg-brand-surface2 dark:bg-brand-surface2Dark rounded-xl p-3 space-y-1.5">
                <div className="flex items-center gap-2"><span className="text-lg">{template.icon}</span><span className="text-xs font-bold text-brand-indigo dark:text-brand-indigoDark">{template.title}</span></div>
                <p className="text-sm font-bold">{offer}</p>
                <p className="text-[11px] text-brand-sub dark:text-brand-subDark">Действует: {time}</p>
              </div>
              <div className="text-center pt-2">
                <p className="text-xs font-bold">Покажите это сообщение при оплате</p>
                <div className="bg-brand-surface2 dark:bg-brand-surface2Dark mt-2 p-3 rounded-xl"><div className="font-mono text-[10px] tracking-[0.3em] text-center">▮▮▯▮▯▮▮▯▮▮▯▮</div></div>

              <p><span className="text-brand-sub dark:text-brand-subDark">Период: </span><strong>{time}</strong></p>
              <p><span className="text-brand-sub dark:text-brand-subDark">Предложение: </span><strong>{offer}</strong></p>
              <p><span className="text-brand-sub dark:text-brand-subDark">Бюджет: </span><strong>{formatTenge(budget)}</strong></p>
            </div>
            <div className="p-4 rounded-xl bg-brand-greenSoft dark:bg-brand-greenSoftDark flex items-center justify-between">
              <span className="text-xs font-bold text-brand-green uppercase">Ожидаемая доп. выручка</span>
              <span className="text-lg font-display font-extrabold text-brand-green">+{formatTenge(sales.extraRevenueMonth)}/мес</span>

/* ============================================================
   CRM
============================================================ */
function CrmScreen({ customers, setCustomers, showToast, logHistory }) {
  const [query, setQuery] = useState('');
  const [segment, setSegment] = useState('Все');
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ name: '', phone: '', visits: 1, lastVisitDays: 0 });
  const [errors, setErrors] = useState({});

  const filtered = customers.filter(c => {
    if (segment !== 'Все' && c.tag !== segment) return false;
    if (query && !(`${c.name} ${c.phone}`.toLowerCase().includes(query.toLowerCase()))) return false;
    return true;
  });

  const addCustomer = () => {
    const errs = {};
    if (!form.name.trim()) errs.name = 'Укажите имя клиента';
    if (!form.phone.trim()) errs.phone = 'Укажите телефон';
    setErrors(errs);
    if (Object.keys(errs).length > 0) return;
    const visits = Number(form.visits) || 0;
    const lastVisitDays = Number(form.lastVisitDays) || 0;
    const chance = calcChance(visits, lastVisitDays);
    const newCust = { id: nextId('cust'), name: form.name, phone: form.phone, visits, lastVisitDays, favorite: '—', chance, tag: tagFromChance(chance) };
    setCustomers([newCust, ...customers]);
    logHistory(`Добавлен новый клиент: ${form.name}`, '👤');
    showToast(`Клиент «${form.name}» добавлен в базу`);
    setForm({ name: '', phone: '', visits: 1, lastVisitDays: 0 });
    setErrors({});
    setShowAdd(false);
  };

  const sendMsg = (c) => {
    logHistory(`Отправлено сообщение клиенту ${c.name}`, '📩');
    showToast(`Сообщение отправлено: ${c.name}`);
  };

  return (
    <div className="max-w-6xl mx-auto space-y-6 animate-fadeIn">
      <div className="flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h1 className="text-2xl font-display font-extrabold">Клиентская база</h1>
          <p className="text-sm text-brand-sub dark:text-brand-subDark mt-1">Знать своих клиентов лучше маркетплейса — ваше главное преимущество перед Kaspi и Wildberries.</p>
        </div>
        <Button onClick={() => setShowAdd(true)}><Icon.Plus className="w-4 h-4" /> Добавить клиента</Button>
      </div>

      <div className="flex flex-col md:flex-row gap-3">
        <div className="relative flex-1">
          <Icon.Search className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-brand-sub dark:text-brand-subDark" aria-hidden="true" />
          <input className={inputCls + ' pl-10'} placeholder="Поиск по имени или телефону..." value={query} onChange={e => setQuery(e.target.value)} aria-label="Поиск клиента" />
        </div>
        <select className={inputCls + ' md:w-48'} value={segment} onChange={e => setSegment(e.target.value)} aria-label="Фильтр по сегменту">
          {['Все', 'VIP', 'Regular', 'At Risk'].map(s => <option key={s} value={s}>{s === 'Все' ? 'Все сегменты' : s}</option>)}
        </select>
      </div>

      {filtered.length === 0 ? (
        <EmptyState text="Клиенты не найдены" sub="Измените фильтры или добавьте нового клиента" />
      ) : (
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          {filtered.map(c => (
            <Card key={c.id} className="p-5 space-y-4" lift>
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-full bg-brand-indigoSoft dark:bg-brand-indigoSoftDark flex items-center justify-center font-display font-extrabold text-brand-indigo dark:text-brand-indigoDark" aria-hidden="true">
                    {c.name.split(' ').map(w => w[0]).join('')}
                  </div>
                  <div>
                    <div className="flex items-center gap-2"><p className="font-bold text-sm">{c.name}</p><Badge className={c.tag === 'VIP' ? 'bg-brand-greenSoft dark:bg-brand-greenSoftDark text-brand-green' : c.tag === 'At Risk' ? 'bg-brand-redSoft dark:bg-brand-redSoftDark text-brand-red' : 'bg-brand-surface2 dark:bg-brand-surface2Dark text-brand-sub dark:text-brand-subDark'}>{c.tag}</Badge></div>
                    <p className="text-xs text-brand-sub dark:text-brand-subDark">{c.phone}</p>
                  </div>
                </div>
                <IconButton icon={Icon.Send} onClick={() => sendMsg(c)} label={`Отправить сообщение ${c.name}`} />
              </div>
              <div className="space-y-2 pt-2 border-t border-brand-border dark:border-brand-borderDark text-xs">
                <div className="flex justify-between"><span className="text-brand-sub dark:text-brand-subDark">Визитов</span><span className="font-bold">{c.visits}</span></div>
                <div className="flex justify-between"><span className="text-brand-sub dark:text-brand-subDark">Не был(а)</span><span className="font-bold">{c.lastVisitDays} дн</span></div>
                <div>
                  <div className="flex justify-between mb-1"><span className="text-brand-sub dark:text-brand-subDark">Вероятность возврата<InfoNote>48 базовых баллов + 3.2 за каждый визит − 1.35 за каждый день без визита, ограничено диапазоном 5–99%.</InfoNote></span><span className="font-extrabold text-brand-indigo dark:text-brand-indigoDark">{c.chance}%</span></div>
                  <div className="w-full h-1.5 bg-brand-surface2 dark:bg-brand-surface2Dark rounded-full overflow-hidden"><div className="h-full bg-brand-indigo dark:bg-brand-indigoDark rounded-full transition-base" style={{ width: `${c.chance}%` }} /></div>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      {showAdd && (
        <Modal title="Добавить клиента" onClose={() => setShowAdd(false)}>
          <div className="space-y-4">
            <Field label="Имя">
              <input className={inputCls} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} aria-invalid={!!errors.name} />
              {errors.name && <p className="text-[11px] text-brand-red mt-1">{errors.name}</p>}
            </Field>
            <Field label="Телефон">
              <input className={inputCls} value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })} placeholder="+7 700 000-0000" aria-invalid={!!errors.phone} />
              {errors.phone && <p className="text-[11px] text-brand-red mt-1">{errors.phone}</p>}
            </Field>
            <div className="grid grid-cols-2 gap-4">
              <Field label="Количество визитов"><input type="number" min="0" className={inputCls} value={form.visits} onChange={e => setForm({ ...form, visits: e.target.value })} /></Field>
              <Field label="Дней с последнего визита"><input type="number" min="0" className={inputCls} value={form.lastVisitDays} onChange={e => setForm({ ...form, lastVisitDays: e.target.value })} /></Field>
            </div>
            <Button className="w-full" onClick={addCustomer}>Добавить в базу</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

            <div key={seg}>
              <div className="flex justify-between text-xs font-bold mb-1"><span>{seg}</span><span className="text-brand-indigo dark:text-brand-indigoDark">{count} · {Math.round((count / total) * 100)}%</span></div>
              <div className="w-full h-2.5 bg-brand-surface2 dark:bg-brand-surface2Dark rounded-full overflow-hidden"><div className="h-full bg-brand-indigo dark:bg-brand-indigoDark rounded-full transition-base" style={{ width: `${(count / total) * 100}%` }} /></div>
            </div>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ============================================================
   PROFILE / CABINET
============================================================ */
function ProfileScreen({ business, setBusiness, installedScenarios, history, customers, showToast, logHistory, businessTypes, onPause, onResume, onComplete }) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState(business);

  const save = () => { setBusiness(form); logHistory('Обновлён профиль бизнеса', '✏️'); showToast('Профиль обновлён'); setEditing(false); };

  const avgChance = customers.length ? Math.round(customers.reduce((s, c) => s + c.chance, 0) / customers.length) : 0;
  const activeCount = installedScenarios.filter(s => s.status === 'Active').length;
  const parts = calcGrowthScoreParts(customers, activeCount, avgChance);
  const sales = calcBusinessSales(business, installedScenarios);
  const returningCustomers = customers.filter(c => c.visits > 1).length;
  const activeScenarios = installedScenarios.filter(s => s.status === 'Active');
  const avgRevenuePct = activeScenarios.length ? Math.round(activeScenarios.reduce((s, c) => s + c.forecast.revenue, 0) / activeScenarios.length) : 0;

  const hasTraffic = installedScenarios.some(s => s.status === 'Active' && s.category === 'marketing');
  const tips = [];
  if (avgChance < 70) tips.push('Средний шанс возврата клиентов ниже 70% — запустите Win-Back Push, чтобы напомнить о себе тем, кто давно не заходил.');
  if (!hasTraffic) tips.push('У вас нет активных сценариев для привлечения новых клиентов — попробуйте Flash Slot или Student Hour.');
  if (installedScenarios.length === 0) tips.push('Пока не запущено ни одного сценария — начните с рекомендации на главной странице.');
  if (tips.length === 0) tips.push('Все ключевые направления закрыты — продолжайте следить за аналитикой и обновляйте предложения раз в 2–3 недели.');

  const statCards = [
    { label: 'Продажи / мес', value: formatTenge(sales.currentRevenue), sub: (sales.revenueGrowthPct >= 0 ? '+' : '') + sales.revenueGrowthPct + '% к базе', icon: <Icon.Coin className="w-4 h-4" /> },
    { label: 'Клиенты', value: customers.length, sub: `из них повторных: ${returningCustomers}`, icon: <Icon.Users className="w-4 h-4" /> },
    { label: 'Повторные покупки', value: returningCustomers, sub: `${customers.length ? Math.round((returningCustomers / customers.length) * 100) : 0}% базы`, icon: <Icon.Repeat className="w-4 h-4" /> },
    { label: 'Активные кампании', value: activeCount, sub: `всего запущено: ${installedScenarios.length}`, icon: <Icon.Spark className="w-4 h-4" /> },
    { label: 'Growth Score', value: parts.score, sub: 'из 100', icon: <Icon.Chart className="w-4 h-4" /> },
    { label: 'Эффективность маркетинга', value: '+' + avgRevenuePct + '%', sub: 'средний прирост чека по активным кампаниям', icon: <Icon.Flame className="w-4 h-4" /> },
  ];

  return (
    <div className="max-w-5xl mx-auto space-y-6 animate-fadeIn pb-10">
      <Card className="p-6">
        <div className="flex items-center justify-between flex-wrap gap-4">
          <div className="flex items-center gap-4">
            <div className="w-14 h-14 rounded-2xl bg-brand-indigoSoft dark:bg-brand-indigoSoftDark flex items-center justify-center text-2xl" aria-hidden="true">{businessTypes.find(b => b.id === business.type)?.icon}</div>
            <div>
              <h1 className="text-xl font-display font-extrabold">{business.name}</h1>
              <p className="text-xs text-brand-sub dark:text-brand-subDark mt-0.5">{businessTypes.find(b => b.id === business.type)?.label} · {BUSINESS_SIZES.find(s => s.id === business.size)?.label} {business.address ? `· ${business.address}` : ''}</p>
            </div>
          </div>
          <Button variant="secondary" onClick={() => editing ? save() : (setForm(business), setEditing(true))}>
            {editing ? <><Icon.Check className="w-4 h-4" /> Сохранить</> : <><Icon.Edit className="w-4 h-4" /> Изменить</>}
          </Button>
        </div>
        {editing && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-5 pt-5 border-t border-brand-border dark:border-brand-borderDark animate-fadeIn">
            <Field label="Название"><input className={inputCls} value={form.name} onChange={e => setForm({ ...form, name: e.target.value })} /></Field>
            <Field label="Адрес"><input className={inputCls} value={form.address} onChange={e => setForm({ ...form, address: e.target.value })} /></Field>
          </div>
        )}
        <div className="flex flex-wrap gap-2 mt-4">{business.goals.map(g => <Badge key={g} className="bg-brand-surface2 dark:bg-brand-surface2Dark">{GOALS_OPTIONS.find(o => o.id === g)?.label}</Badge>)}</div>
      </Card>

      <div>
        <p className="text-xs font-bold uppercase tracking-wide text-brand-sub dark:text-brand-subDark mb-3">Базовая статистика личного кабинета</p>
        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">{statCards.map((s, i) => <StatCard key={i} {...s} />)}</div>
      </div>

      <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <Card className="p-6">
          <h2 className="font-display font-bold text-base mb-4">Активные инструменты</h2>
          {installedScenarios.length === 0 ? <p className="text-sm text-brand-sub dark:text-brand-subDark">Пока ничего не запущено.</p> : (
            <div className="space-y-3">
              {installedScenarios.map(s => {
                const contrib = s.status === 'Active' ? calcScenarioSales(s.forecast, business) : null;
                return (
                  <div key={s.id} className="flex items-center justify-between text-sm gap-2">
                    <span className="font-semibold flex items-center gap-2 min-w-0"><span className="shrink-0">{s.icon}</span><span className="truncate">{s.title}</span></span>
                    <div className="flex items-center gap-2 shrink-0">
                      {contrib && <span className="text-xs font-bold text-brand-green hidden sm:inline">+{formatTenge(contrib.extraRevenueMonth)}</span>}
                      <ScenarioStatusBadge status={s.status} />
                      <ScenarioActions scenario={s} onPause={onPause} onResume={onResume} onComplete={onComplete} />
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </Card>
        <Card className="p-6">
          <h2 className="font-display font-bold text-base mb-4">Рекомендации по улучшению</h2>
          <ul className="space-y-3">{tips.map((t, i) => <li key={i} className="text-sm flex gap-2.5"><span className="text-brand-indigo dark:text-brand-indigoDark shrink-0">→</span><span className="text-brand-sub dark:text-brand-subDark">{t}</span></li>)}</ul>
        </Card>
      </div>

      <Card className="p-6">
        <h2 className="font-display font-bold text-base mb-4">История действий</h2>
        {history.length === 0 ? <p className="text-sm text-brand-sub dark:text-brand-subDark">Действий пока нет.</p> : (
          <div className="space-y-3">
            {history.slice().reverse().map(h => (
              <div key={h.id} className="flex items-center gap-3 text-sm">
                <span className="w-8 h-8 rounded-lg bg-brand-surface2 dark:bg-brand-surface2Dark flex items-center justify-center text-base shrink-0" aria-hidden="true">{h.icon}</span>
                <span className="flex-1">{h.text}</span>
                <span className="text-xs text-brand-sub dark:text-brand-subDark shrink-0">{timeAgo(h.timestamp)}</span>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

/* ============================================================
   ADMIN PANEL — CRUD wired through the Repository (Api) layer,
   with real pending/loading states on every mutation.
============================================================ */
function AdminScreen({ templates, refreshTemplates, categories, refreshCategories, businessTypes, refreshBusinessTypes, profiles, activeType, business, customersCount, installedScenarios }) {
  const [modalOpen, setModalOpen] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(emptyTemplateForm());
  const [saving, setSaving] = useState(false);
  const [deletingId, setDeletingId] = useState(null);
  const [newCategory, setNewCategory] = useState('');
  const [catBusy, setCatBusy] = useState(false);
  const [btModalOpen, setBtModalOpen] = useState(false);
  const [btEditingId, setBtEditingId] = useState(null);
  const [btForm, setBtForm] = useState({ label: '', icon: '🏪' });
  const [btSaving, setBtSaving] = useState(false);
  const [tab, setTab] = useState('templates');

  function emptyTemplateForm() {
    return { title: '', category: categories[0] || 'marketing', icon: '✨', description: '', defaultAudience: '', defaultTime: '', defaultOffer: '',
      businessTypes: [businessTypes[0]?.id].filter(Boolean), fillsEmptyHours: false, automated: false, baseVisitorImpact: 15, baseRevenueImpact: 15, installsCount: 0 };
  }

  const openNew = () => { setForm(emptyTemplateForm()); setEditingId(null); setModalOpen(true); };
  const openEdit = (t) => { setForm({ ...t }); setEditingId(t.id); setModalOpen(true); };
  const toggleBT = (id) => setForm(f => ({ ...f, businessTypes: f.businessTypes.includes(id) ? f.businessTypes.filter(b => b !== id) : [...f.businessTypes, id] }));

  const saveTemplate = async () => {
    if (!form.title.trim()) return;
    setSaving(true);
    if (editingId) await Api.templates.update(editingId, form); else await Api.templates.create(form);
    await refreshTemplates();
    setSaving(false);
    setModalOpen(false);
  };

  const deleteTemplate = async (id) => {
    setDeletingId(id);
    await Api.templates.remove(id);
    await refreshTemplates();
    setDeletingId(null);
  };

  const addCategory = async () => {
    const v = newCategory.trim();
    if (!v || categories.includes(v)) return;
    setCatBusy(true);
    await Api.categories.create(v);
    await refreshCategories();
    setNewCategory('');
    setCatBusy(false);
  };
  const removeCategory = async (cat) => {
    if (templates.some(t => t.category === cat)) return;
    setCatBusy(true);
    await Api.categories.remove(cat);
    await refreshCategories();
    setCatBusy(false);
  };

  const openNewBt = () => { setBtForm({ label: '', icon: '🏪' }); setBtEditingId(null); setBtModalOpen(true); };
  const openEditBt = (bt) => { setBtForm({ label: bt.label, icon: bt.icon }); setBtEditingId(bt.id); setBtModalOpen(true); };
  const saveBt = async () => {
    if (!btForm.label.trim()) return;
    setBtSaving(true);
    if (btEditingId) await Api.businessTypes.update(btEditingId, btForm); else await Api.businessTypes.create(btForm);
    await refreshBusinessTypes();
    setBtSaving(false);
    setBtModalOpen(false);
  };
  const removeBt = async (id) => {
    const inUse = templates.some(t => t.businessTypes.includes(id)) || Object.values(profiles).some(p => p.business.type === id);
    if (inUse) return;
    setBtSaving(true);
    await Api.businessTypes.remove(id);
    await refreshBusinessTypes();
    setBtSaving(false);
  };

  const businessList = Object.values(profiles);
  const totalInstallsAggregate = templates.reduce((s, t) => s + (t.installsCount || 0), 0);
  const popularTemplates = [...templates].sort((a, b) => (b.installsCount || 0) - (a.installsCount || 0)).slice(0, 5);
  const totalCustomers = businessList.reduce((s, p) => s + p.customers.length, 0);
  const totalActiveCampaigns = businessList.reduce((s, p) => s + p.installedScenarios.filter(x => x.status === 'Active').length, 0);
  const withScenarios = businessList.filter(p => p.installedScenarios.some(x => x.status === 'Active'));
  const avgPlatformRevenuePct = withScenarios.length ? Math.round(withScenarios.reduce((s, p) => s + calcBusinessSales(p.business, p.installedScenarios).revenueGrowthPct, 0) / withScenarios.length) : 0;

  return (
    <div className="max-w-6xl mx-auto space-y-6 animate-fadeIn pb-10">
      <div>
        <h1 className="text-2xl font-display font-extrabold">Админ-панель</h1>
        <p className="text-sm text-brand-sub dark:text-brand-subDark mt-1">Управление каталогом сценариев, категориями и типами бизнеса через слой Repository (Api). Изменения сразу видны во всех бизнесах на платформе.</p>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
        <StatCard label="Шаблонов в каталоге" value={templates.length} />
        <StatCard label="Типов бизнеса" value={businessTypes.length} />
        <StatCard label="Бизнесов открыто в сессии" value={businessList.length} />
        <StatCard label="Клиентов во всех базах" value={totalCustomers} />
      </div>

      <div className="flex gap-2 flex-wrap">
        {[['templates', 'Шаблоны сценариев'], ['categories', 'Категории'], ['types', 'Типы бизнеса'], ['platform', 'Аналитика платформы'], ['architecture', 'Архитектура']].map(([id, label]) => (
          <button key={id} onClick={() => setTab(id)} aria-pressed={tab === id}
            className={`px-4 py-2 rounded-xl text-xs font-bold transition-base focus-ring ${tab === id ? 'bg-brand-text dark:bg-brand-textDark text-brand-bg dark:text-brand-bgDark' : 'bg-brand-surface2 dark:bg-brand-surface2Dark text-brand-sub dark:text-brand-subDark'}`}>{label}</button>
        ))}
      </div>

      {tab === 'templates' && (
        <Card className="p-6">
          <div className="flex items-center justify-between mb-4">
            <h2 className="font-display font-bold text-base">Каталог шаблонов</h2>
            <Button onClick={openNew}><Icon.Plus className="w-4 h-4" /> Новый шаблон</Button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-left text-sm min-w-[780px]">
              <thead>
                <tr className="border-b border-brand-border dark:border-brand-borderDark text-xs text-brand-sub dark:text-brand-subDark">
                  <th className="pb-2.5 pr-4">Шаблон</th><th className="pb-2.5 pr-4">Категория</th><th className="pb-2.5 pr-4">Типы бизнеса</th><th className="pb-2.5 pr-4">Базовый эффект</th><th className="pb-2.5 pr-4">Установок</th><th className="pb-2.5 text-right">Действия</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-brand-border dark:divide-brand-borderDark">
                {templates.map(t => (
                  <tr key={t.id}>
                    <td className="py-3 pr-4 font-semibold flex items-center gap-2"><span>{t.icon}</span>{t.title}</td>
                    <td className="py-3 pr-4"><Badge className={getCategoryColor(t.category)}>{getCategoryLabel(t.category)}</Badge></td>

                    <td className="py-3 text-right">
                      <div className="flex justify-end gap-1.5">
                        <IconButton icon={Icon.Edit} onClick={() => openEdit(t)} label={`Изменить ${t.title}`} />
                        <Button variant="danger" className="!px-2 !py-2" loading={deletingId === t.id} onClick={() => deleteTemplate(t.id)} ariaLabel={`Удалить ${t.title}`}><Icon.Trash className="w-4 h-4" /></Button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>
      )}

      {tab === 'categories' && (
        <Card className="p-6">
          <h2 className="font-display font-bold text-base mb-1">Категории сценариев</h2>
          <p className="text-xs text-brand-sub dark:text-brand-subDark mb-4">Названия совпадают с формулировкой кейса SERPIN (маркетинг / продажи / удержание клиентов). Аналитика и автоматизация реализованы как сквозные фильтры каталога, а не отдельные редактируемые категории — они встроены в каждый сценарий.</p>
          <div className="space-y-2 mb-5">
            {categories.map(c => {
              const inUse = templates.some(t => t.category === c);
              return (
                <div key={c} className="flex items-center justify-between p-3 rounded-xl bg-brand-surface2 dark:bg-brand-surface2Dark">
                  <span className="text-sm font-semibold">{getCategoryLabel(c)} <span className="text-brand-sub dark:text-brand-subDark font-normal">({c})</span></span>
                  <IconButton icon={Icon.Trash} onClick={() => removeCategory(c)} label={inUse ? 'Категория используется в шаблонах' : 'Удалить'} danger className={inUse ? 'opacity-30 pointer-events-none' : ''} />
                </div>
              );
            })}
          </div>
          <div className="flex gap-2">
            <input className={inputCls} placeholder="Название новой категории" value={newCategory} onChange={e => setNewCategory(e.target.value)} />
            <Button onClick={addCategory} loading={catBusy}>Добавить</Button>
          </div>

      {tab === 'types' && (

                <button onClick={() => setForm({ ...form, automated: !form.automated })} className={`w-5 h-5 rounded-md flex items-center justify-center transition-base ${form.automated ? 'bg-brand-indigo text-white' : 'border border-brand-border dark:border-brand-borderDark'}`}>{form.automated && <Icon.Check className="w-3.5 h-3.5" />}</button>
                <span className="text-sm font-semibold">Работает автоматически</span>

            </div>
            <Button className="w-full" onClick={saveTemplate} loading={saving}>{editingId ? 'Сохранить изменения' : 'Добавить шаблон'}</Button>
          </div>
        </Modal>
      )}

      {btModalOpen && (
        <Modal title={btEditingId ? 'Изменить тип бизнеса' : 'Новый тип бизнеса'} onClose={() => setBtModalOpen(false)}>
          <div className="space-y-4">
            <Field label="Название"><input className={inputCls} value={btForm.label} onChange={e => setBtForm({ ...btForm, label: e.target.value })} placeholder="Например, Аптека" /></Field>
            <Field label="Иконка (эмодзи)"><input className={inputCls} value={btForm.icon} onChange={e => setBtForm({ ...btForm, icon: e.target.value })} /></Field>
            <Button className="w-full" onClick={saveBt} loading={btSaving}>{btEditingId ? 'Сохранить' : 'Добавить тип'}</Button>
          </div>
        </Modal>
      )}
    </div>
  );
}

============================================================ */
function BusinessSwitcher({ businessTypes, activeType, onSwitch, business, onNavigate }) {
  const [open, setOpen] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const onClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onKey = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onClick);
    document.addEventListener('keydown', onKey);
    return () => { document.removeEventListener('mousedown', onClick); document.removeEventListener('keydown', onKey); };
  }, []);

  return (
    <div className="relative" ref={ref}>
      <button onClick={() => setOpen(!open)} aria-haspopup="listbox" aria-expanded={open}
        className="w-full flex items-center gap-2.5 px-2 py-2 rounded-xl hover:bg-brand-surface2 dark:hover:bg-brand-surface2Dark transition-base focus-ring">
        <div className="w-8 h-8 rounded-full bg-brand-indigoSoft dark:bg-brand-indigoSoftDark flex items-center justify-center text-sm shrink-0" aria-hidden="true">{businessTypes.find(b => b.id === business.type)?.icon}</div>
        <div className="min-w-0 text-left flex-1">
          <p className="text-xs font-bold truncate">{business.name}</p>
          <p className="text-[10px] text-brand-sub dark:text-brand-subDark truncate">{businessTypes.find(b => b.id === business.type)?.label}</p>
        </div>
        <Icon.Chevron className={`w-3.5 h-3.5 text-brand-sub dark:text-brand-subDark shrink-0 transition-base ${open ? 'rotate-180' : ''}`} />
      </button>
      {open && (
        <div className="absolute bottom-full left-0 right-0 mb-2 bg-brand-surface dark:bg-brand-surfaceDark border border-brand-border dark:border-brand-borderDark rounded-xl shadow-2xl overflow-hidden animate-popIn z-30" role="listbox">
          <p className="text-[10px] font-bold uppercase tracking-wide text-brand-sub dark:text-brand-subDark px-3 pt-3 pb-1">Переключить бизнес</p>
          {businessTypes.map(bt => (
            <button key={bt.id} role="option" aria-selected={bt.id === activeType} onClick={() => { onSwitch(bt.id); setOpen(false); onNavigate && onNavigate(); }}
              className={`w-full flex items-center gap-2.5 px-3 py-2.5 text-left hover:bg-brand-surface2 dark:hover:bg-brand-surface2Dark transition-base ${bt.id === activeType ? 'bg-brand-indigoSoft dark:bg-brand-indigoSoftDark' : ''}`}>
              <span className="text-lg">{bt.icon}</span>
              <span className="text-xs font-semibold flex-1">{bt.label}</span>
              {bt.id === activeType && <Icon.Check className="w-3.5 h-3.5 text-brand-indigo dark:text-brand-indigoDark" />}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   APP ROOT
============================================================ */
function App() {
  const [isDark, setIsDark] = useState(false);
  const [route, setRoute] = useState(window.location.hash.replace('#', '') || 'landing');
  const [booting, setBooting] = useState(true);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);

  const [templates, setTemplates] = useState([]);
  const [categories, setCategories] = useState([]);
  const [businessTypes, setBusinessTypes] = useState([]);

  const [profiles, setProfiles] = useState({});
  const [activeType, setActiveType] = useState(null);
  const [isSwitching, setIsSwitching] = useState(false);

  const [selectedTemplateId, setSelectedTemplateId] = useState(null);
  const [toast, setToast] = useState(null);

  // Boot: hydrate global catalog data from the Repository layer.
  useEffect(() => {
    Promise.all([Api.templates.list(), Api.categories.list(), Api.businessTypes.list()]).then(([t, c, b]) => {
      setTemplates(t); setCategories(c); setBusinessTypes(b); setBooting(false);
    });
  }, []);

  const refreshTemplates = async () => setTemplates(await Api.templates.list());
  const refreshCategories = async () => setCategories(await Api.categories.list());
  const refreshBusinessTypes = async () => setBusinessTypes(await Api.businessTypes.list());

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);

  useEffect(() => {
    const onHash = () => setRoute(window.location.hash.replace('#', '') || (activeType ? 'home' : 'landing'));
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, [activeType]);

  const navigate = (r) => { window.location.hash = r; setRoute(r); };
  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 3200); };

  const activeProfile = activeType ? profiles[activeType] : null;
  const business = activeProfile ? activeProfile.business : null;
  const customers = activeProfile ? activeProfile.customers : [];
  const favorites = activeProfile ? activeProfile.favorites : [];
  const installedScenarios = activeProfile ? activeProfile.installedScenarios : [];
  const history = activeProfile ? activeProfile.history : [];

  const updateActiveProfile = (updater) => { if (!activeType) return; setProfiles(prev => ({ ...prev, [activeType]: updater(prev[activeType]) })); };
  const logHistory = (text, icon) => updateActiveProfile(p => ({ ...p, history: [...p.history, { id: nextId('hist'), text, icon: icon || '•', timestamp: Date.now() }] }));
  const setBusiness = (next) => updateActiveProfile(p => ({ ...p, business: typeof next === 'function' ? next(p.business) : next }));
  const setCustomers = (next) => updateActiveProfile(p => ({ ...p, customers: typeof next === 'function' ? next(p.customers) : next }));
  const toggleFavorite = (id) => updateActiveProfile(p => ({ ...p, favorites: p.favorites.includes(id) ? p.favorites.filter(x => x !== id) : [...p.favorites, id] }));

  const setScenarioStatus = (id, status) => updateActiveProfile(p => ({ ...p, installedScenarios: p.installedScenarios.map(s => s.id === id ? { ...s, status } : s) }));
  const pauseScenario = (id) => { setScenarioStatus(id, 'Paused'); logHistory('Сценарий поставлен на паузу', '⏸'); showToast('Сценарий поставлен на паузу'); };
  const resumeScenario = (id) => { setScenarioStatus(id, 'Active'); logHistory('Сценарий возобновлён', '▶'); showToast('Сценарий возобновлён'); };
  const completeScenario = (id) => { setScenarioStatus(id, 'Completed'); logHistory('Сценарий завершён', '✅'); showToast('Сценарий завершён'); };

  const completeOnboarding = (form) => {
    const biz = { name: form.name, type: form.type, size: form.size, address: form.address, goals: form.goals };
    const custs = generateCustomers(form.type, templates);
    setProfiles(prev => ({ ...prev, [form.type]: { business: biz, customers: custs, favorites: [], installedScenarios: [], history: [{ id: nextId('hist'), text: `Бизнес «${form.name}» зарегистрирован на платформе`, icon: '🎉', timestamp: Date.now() }] } }));
    setActiveType(form.type);
    navigate('home');
  };

  const switchBusiness = (type) => {
    if (type === activeType || isSwitching) return;
    setIsSwitching(true);
    setTimeout(() => {
      setProfiles(prev => prev[type] ? prev : { ...prev, [type]: defaultProfileForType(type, templates, businessTypes) });
      setActiveType(type);
      navigate('home');
      showToast(`🔄 Переключено на: ${businessTypes.find(b => b.id === type)?.label || type}`);
      setIsSwitching(false);
    }, 380);
  };

  const openBuilder = (templateId) => { setSelectedTemplateId(templateId); navigate('builder'); };

  const confirmLaunch = (template, params) => {
    const sales = calcScenarioSales(params.forecast, business);
    const newScenario = { id: nextId('camp'), templateId: template.id, title: template.title, icon: template.icon, category: template.category, time: params.time, offer: params.offer, forecast: params.forecast, status: 'Active', installedAt: Date.now() };
    updateActiveProfile(p => ({ ...p, installedScenarios: [newScenario, ...p.installedScenarios] }));
    Api.templates.incrementInstalls(template.id).then(refreshTemplates);
    logHistory(`Запущен сценарий «${template.title}»`, template.icon);
    showToast(`🚀 Сценарий «${template.title}» запущен · +${formatTenge(sales.extraRevenueMonth)}/мес`);
    setSelectedTemplateId(null);
    navigate('home');
  };

  if (booting) return <BootScreen />;

  if (!business) {
    if (route === 'onboarding') return <Onboarding onComplete={completeOnboarding} businessTypes={businessTypes} />;
    return <Landing templates={templates} onStart={() => navigate('onboarding')} />;
  }

  const selectedTemplate = templates.find(t => t.id === selectedTemplateId) || null;
  const currentTitle = NAV_ITEMS.find(i => i.id === route)?.label || 'Growth Store';

  const sidebarProps = { route, navigate, business, isDark, setIsDark, favCount: favorites.length, businessTypes, activeType, switchBusiness };

  return (
    <div className="flex flex-col md:flex-row h-screen overflow-hidden">
      {toast && (
        <div role="status" aria-live="polite" className="fixed top-5 right-5 z-50 bg-brand-text dark:bg-brand-indigo text-brand-bg dark:text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-2.5 animate-toastIn">
          <Icon.Check className="w-4 h-4" /><span className="font-semibold text-sm">{toast}</span>
        </div>
      )}

      <Sidebar {...sidebarProps} />
      <MobileTopBar onOpenMenu={() => setMobileNavOpen(true)} title={currentTitle} />
      <MobileDrawer open={mobileNavOpen} onClose={() => setMobileNavOpen(false)} {...sidebarProps} />

      <main className="flex-1 overflow-y-auto p-4 md:p-8">
        {isSwitching ? <ScreenSkeleton /> : (
          <>
            {route === 'home' && <HomeScreen business={business} customers={customers} templates={templates} installedScenarios={installedScenarios} navigate={navigate} openBuilder={openBuilder} onPause={pauseScenario} onResume={resumeScenario} onComplete={completeScenario} />}
            {route === 'store' && <StoreScreen business={business} templates={templates} favorites={favorites} toggleFavorite={toggleFavorite} openBuilder={openBuilder} categories={categories} businessTypes={businessTypes} installedScenarios={installedScenarios} />}
            {route === 'builder' && <BuilderScreen template={selectedTemplate} business={business} onConfirm={confirmLaunch} navigate={navigate} />}
            {route === 'customers' && <CrmScreen customers={customers} setCustomers={setCustomers} showToast={showToast} logHistory={logHistory} />}
            {route === 'analytics' && <AnalyticsScreen business={business} customers={customers} installedScenarios={installedScenarios} />}
            {route === 'recommendations' && <RecommendationsScreen templates={templates} business={business} customers={customers} installedScenarios={installedScenarios} openBuilder={openBuilder} businessTypes={businessTypes} />}
            {route === 'profile' && <ProfileScreen business={business} setBusiness={setBusiness} installedScenarios={installedScenarios} history={history} customers={customers} showToast={showToast} logHistory={logHistory} businessTypes={businessTypes} onPause={pauseScenario} onResume={resumeScenario} onComplete={completeScenario} />}
            {route === 'admin' && <AdminScreen templates={templates} refreshTemplates={refreshTemplates} categories={categories} refreshCategories={refreshCategories} businessTypes={businessTypes} refreshBusinessTypes={refreshBusinessTypes} profiles={profiles} activeType={activeType} business={business} customersCount={customers.length} installedScenarios={installedScenarios} />}
          </>
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
